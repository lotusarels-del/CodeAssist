name: Android CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      # Cancel previous runs of this workflow
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.5.0
        with:
          access_token: ${{ github.token }}

      # Checkout the repository
      - uses: actions/checkout@v4

      # Set up JDK 25 (latest)
      - name: Set up JDK 25
        uses: actions/setup-java@v2
        with:
          java-version: '25'
          distribution: 'adopt'

      # Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build the debug APK with Gradle and caching
      - name: Build debug APK
        uses: eskatos/gradle-command-action@v1
        with:
          arguments: assembleDebug
          distributions-cache-enabled: false
          dependencies-cache-enabled: false
          configuration-cache-enabled: false
          dependencies-cache-exact: false
          configuration-cache-exact: false
          cache-read-only: false
        env:
          JAVA_HOME: /opt/hostedtoolcache/Java_Adopt_jdk/25/x64

      # Upload debug APK artifact
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug
          
